<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Laravel Log Center">
  <style>
    .doc { fill: #1F2430; }
    .gap { stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .doc { fill: #2E3546; }
      .gap { stroke: #0D1117; }
    }
  </style>
  <!-- log document -->
  <rect class="doc" x="72" y="56" width="300" height="380" rx="40"/>
  <g stroke-linecap="round" stroke-width="22">
    <circle cx="124" cy="128" r="12" fill="#F53B3B"/>
    <line x1="164" y1="128" x2="320" y2="128" stroke="#FFFFFF"/>
    <circle cx="124" cy="190" r="12" fill="#9AA1AE"/>
    <line x1="164" y1="190" x2="280" y2="190" stroke="#F53B3B"/>
    <circle cx="124" cy="252" r="12" fill="#9AA1AE"/>
    <line x1="164" y1="252" x2="300" y2="252" stroke="#9AA1AE"/>
    <circle cx="124" cy="314" r="12" fill="#F53B3B"/>
    <line x1="164" y1="314" x2="240" y2="314" stroke="#F53B3B"/>
  </g>
  <!-- send trail -->
  <path d="M250 384 C 310 404, 350 386, 380 342" fill="none" stroke="#F53B3B" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <!-- paper plane -->
  <g transform="translate(404 296) rotate(-35) scale(1.3)">
    <path class="gap" d="M-52 -48 L76 0 L-52 48 L-28 0 Z" fill="#F53B3B" stroke-width="16" stroke-linejoin="round"/>
    <path d="M-52 -48 L76 0 L-52 48 L-28 0 Z" fill="#F53B3B"/>
    <path d="M-28 0 L76 0 L-52 48 Z" fill="#C81E1E"/>
  </g>
</svg>
